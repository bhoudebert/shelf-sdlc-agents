version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Dependabot's titles must pass the Conventional Commits check: "build(deps): bump ...".
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  # Warden's crates (Rust). Minor and patch updates arrive as one pull request a week, so the guard is kept current
  # without a flood; a major update is its own pull request.
  - package-ecosystem: cargo
    directory: /warden
    schedule:
      interval: weekly
    groups:
      warden-crates:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  # The base images of the Dockerfile (Python, Rust).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

