name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Reads Conventional Commits since the last release and maintains a release pull request with the changelog and the
    # version bump; merging that pull request tags the release.
    runs-on: ubuntu-latest
    outputs:
      warden_released: ${{ steps.release.outputs['warden--release_created'] }}
      warden_tag: ${{ steps.release.outputs['warden--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A pull request opened with the workflow's own token starts no other workflow, so the required checks would
          # never run on the release pull request. Give a personal access token (or a GitHub App token) as the secret
          # RELEASE_PLEASE_TOKEN to have them run; without it the release pull request needs an administrator to merge.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag made with the workflow's own token starts no other workflow, so the binaries of a Warden release are built here,
  # in the same run, when release-please says it made one.
  warden-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.warden_released == 'true' }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, runner: macos-latest, musl: false }
          - { target: x86_64-apple-darwin, runner: macos-latest, musl: false }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.warden_tag }}
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: warden
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/warden-${{ matrix.target }}.tar.gz" -C "warden/target/${{ matrix.target }}/release" warden
          cd dist && (sha256sum "warden-${{ matrix.target }}.tar.gz" 2>/dev/null || shasum -a 256 "warden-${{ matrix.target }}.tar.gz") > "warden-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: warden-${{ matrix.target }}
          path: dist/*

  warden-publish:
    needs: [release-please, warden-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the binaries and their checksums on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.warden_tag }}
        run: |
          cd dist
          cat warden-*.sha256 > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" warden-*.tar.gz checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
