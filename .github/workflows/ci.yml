name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per component. A pull request runs only the components it touches, and the job "Quality gate" at the end is the
# one required check: it passes when every job passed or was skipped, so a path filter can never leave a required check
# pending (which a filter on the workflow itself would).
jobs:
  quality-shelf-sdlc-agents:
    name: shelf-sdlc-agents (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - run: python -m pip install uv && uv sync --frozen
      - name: Quality gate
        run: uv run ruff check . && uv run ruff format --check . && uv run pyright && uv run lint-imports && uv run pytest

  quality-warden:
    name: warden (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warden
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            warden/target
          key: warden-${{ runner.os }}-${{ hashFiles('warden/Cargo.lock') }}
      - name: Quality gate
        run: cargo fmt --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: every commit message of the pull request is checked.
          fetch-depth: 0
      - run: sh scripts/check-commit-messages.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Quality gate
    if: always()
    needs: [commits, quality-shelf-sdlc-agents, quality-warden]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          if echo "${{ join(needs.*.result, ' ') }}" | grep -Eq 'failure|cancelled'; then exit 1; fi
