name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per component. A pull request runs only the components it touches, and the job "Quality gate" at the end is the
# one required check: it passes when every job passed or was skipped, so a path filter can never leave a required check
# pending (which a filter on the workflow itself would).
jobs:
  quality-shelf-sdlc-agents:
    name: shelf-sdlc-agents (Node.js / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Quality gate
        run: npm run quality

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: every commit message of the pull request is checked.
          fetch-depth: 0
      - run: sh scripts/check-commit-messages.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Quality gate
    if: always()
    needs: [commits, quality-shelf-sdlc-agents]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          if echo "${{ join(needs.*.result, ' ') }}" | grep -Eq 'failure|cancelled'; then exit 1; fi
