[package]
name = "warden-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Judges a tool call: classifies what a command would do and decides against the policy."

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
warden-policy = { path = "../warden-policy" }
warden-shell = { path = "../warden-shell" }

[lints]
workspace = true
