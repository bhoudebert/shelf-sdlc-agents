[package]
name = "warden-redact"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Finds credentials and personal data in text and swaps them for stable, reversible tokens."
license = "Apache-2.0"
publish = false

[dependencies]
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
