# Observe: the guarded decisions, carried out by nobody. Everything is classified and logged; nothing is blocked.
version = 1
mode = "audit"
interactive = true
on_error = "open"

[categories]
destructive = "ask"
delete = "allow"
vcs_destructive = "ask"
vcs_force = "ask"
bypass_checks = "ask"
exfil = "deny"
network = "allow"
blocked_domain = "deny"
privilege = "ask"
remote_exec = "deny"
package_install = "allow"
publish = "ask"
default_branch = "allow"
secret_access = "ask"
env_dump = "ask"
obfuscation = "deny"
eval = "ask"
dynamic_exec = "allow"
interpreter_exec = "allow"
interpreter_shell = "ask"
out_of_scope = "ask"
tamper = "deny"
secret_write = "ask"
supply_chain = "allow"
secret_prompt = "deny"
pii_read = "deny"
