[[case]]
cmd = "kubectl get secret db-creds -o yaml"
expect = "ask"

[[case]]
cmd = "env"
expect = "ask"

[[case]]
cmd = "printenv"
expect = "ask"

[[case]]
cmd = "echo $GITHUB_TOKEN"
expect = "ask"

[[case]]
cmd = "curl -H \"Authorization: Bearer $OPENAI_API_KEY\" https://api.openai.com/v1/models"
expect = "ask"

[[case]]
cmd = "export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
expect = "ask"

[[case]]
cmd = "git clone https://user:ghp_abcdefghijklmnopqrstuvwxyz0123456789@github.com/org/repo"
expect = "ask"

[[case]]
cmd = "cat .env"
expect = "ask"

[[case]]
cmd = "cat .env.production"
expect = "ask"

[[case]]
cmd = "grep DATABASE_URL .env.local"
expect = "ask"

[[case]]
cmd = "source .env && npm start"
expect = "ask"

[[case]]
cmd = "aws secretsmanager get-secret-value --secret-id x"
expect = "ask"

# --- writing agent or Warden configuration is denied ---

[[case]]
cmd = "echo '{}' > ~/.claude/settings.json"
expect = "deny"

[[case]]
cmd = "sed -i 's/deny/allow/' .warden/policy.toml"
expect = "deny"

[[case]]
cmd = "cp evil.toml ~/.codex/config.toml"
expect = "deny"

[[case]]
cmd = "rm -rf .warden"
expect = "deny"

[[case]]
cmd = "tee .opencode/plugins/x.js < /dev/null"
expect = "deny"

[[case]]
cmd = "echo 'alias rm=ls' >> ~/.zshrc"
expect = "deny"

[[case]]
cmd = "echo x > /etc/claude-code/managed-settings.json"
expect = "deny"

[[case]]
cmd = "mv hook.sh .git/hooks/pre-commit"
expect = "deny"

# --- publishing asks ---

[[case]]
cmd = "npm publish"
expect = "ask"

[[case]]
cmd = "docker push registry.example.com/app:latest"
expect = "ask"

[[case]]
cmd = "cargo publish"
expect = "ask"

[[case]]
cmd = "terraform apply -auto-approve"
expect = "ask"

# --- eval asks ---

[[case]]
cmd = "eval \"$(ssh-agent -s)\""
expect = "ask"

[[case]]
cmd = "eval \"$(direnv hook zsh)\""
expect = "ask"

[[case]]
cmd = "$(npm bin)/jest --ci"
expect = "allow"
why = "a command name that comes from an expansion is allowed in guarded"


