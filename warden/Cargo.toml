[package]
name = "warden"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "A policy engine for coding agents: gates commands, keeps secrets off the model, logs every decision."
license = "Apache-2.0"
repository = "https://github.com/bhoudebert/shelf-sdlc-agents"
publish = false

# The root crate is the `warden` binary; the engine's parts live under crates/ as they are built (see decision 0014).
[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
warden-redact = { path = "crates/warden-redact" }
warden-agents = { path = "crates/warden-agents" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
warden-shell = { path = "crates/warden-shell" }
warden-policy = { path = "crates/warden-policy" }
warden-engine = { path = "crates/warden-engine" }
warden-audit = { path = "crates/warden-audit" }

[dev-dependencies]
warden-audit = { path = "crates/warden-audit" }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
