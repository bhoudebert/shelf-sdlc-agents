[project]
name = "shelf-sdlc"
version = "0.0.0"
description = "A self-hosted software factory: drive agent work on your GitHub repositories from a web UI, from a need to a pull request."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10",
    "temporalio>=1.8",
    "uvicorn>=0.32",
]

[project.scripts]
shelf-web = "shelf.entrypoints.web:main"
shelf-worker = "shelf.entrypoints.worker:main"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = [".claude"]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright header: the LICENSE file covers the project
    "D203",   # one blank line before class docstring: D211 is kept
    "D213",   # multi-line docstring summary on the second line: D212 is kept
    "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "D", "ANN", "ARG001", "ARG002", "ARG005", "FBT003", "E501", "S107"]
# A state machine is a table of transitions: one return per case is the clearest form.
"src/shelf/domain/work.py" = ["PLR0911"]
# Route handlers take what FastAPI injects: request, session and every form field.
"src/shelf/adapters/web/*.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
exclude = [".claude", ".venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=shelf --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/shelf"]

[tool.importlinter]
root_package = "shelf"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: dependencies point inwards"
type = "layers"
layers = [
    "shelf.entrypoints",
    "shelf.adapters",
    "shelf.application",
    "shelf.ports",
    "shelf.domain",
]

[[tool.importlinter.contracts]]
name = "The domain is pure: standard library only"
type = "forbidden"
source_modules = ["shelf.domain"]
forbidden_modules = ["pydantic", "temporalio", "fastapi", "httpx", "jinja2", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Adapters do not know each other"
type = "independence"
modules = ["shelf.adapters.*"]
