# shelf-sdlc on one server: Temporal, the web service and the worker. No reverse proxy is bundled: put your own TLS in front
# of port 8080 (nginx, Traefik, a cloud load balancer, a Kubernetes ingress...), or use a tunnel. See docs/guide/self-hosting.
#
#   cp deploy/.env.example deploy/.env     # set PUBLIC_URL, SESSION_SECRET and your model credentials
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#   open $PUBLIC_URL                       # first run: one click registers the GitHub App and shows what to paste in .env
#
# To use the published image instead of building: replace each `build` block with
# `image: ghcr.io/bhoudebert/shelf-sdlc-agents:latest`.
name: shelf-sdlc

x-shelf: &shelf
  build:
    context: ..
    args:
      SHELF_REVISION: ${SHELF_REVISION:-unknown}
  restart: unless-stopped
  env_file: [.env]
  environment:
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_UI_UPSTREAM: http://temporal:8233
    SHELF_CONFIG: /etc/shelf/shelf.toml
    GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
  volumes:
    # The operator's access list and mode (deploy/config/shelf.toml, created from shelf.toml.example by install.sh). Read-only.
    # A directory is mounted, not the file: an editor that saves by replacing the file would otherwise leave the container
    # looking at the old copy.
    - ./config:/etc/shelf:ro
    # The GitHub App's private key: put the .pem you downloaded at deploy/secrets/github-app.pem. A directory is mounted, not
    # the file, so a missing key never makes Docker invent a directory in its place.
    - ./secrets:/run/secrets:ro
  depends_on:
    temporal:
      condition: service_healthy

services:
  # The durable workflow engine. The dev server with a SQLite file on a volume is enough for a small team; for more, point
  # TEMPORAL_ADDRESS at a Temporal cluster or Temporal Cloud and delete this service.
  temporal:
    image: temporalio/temporal:latest # pin a version for production
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-public-path", "/temporal"]
    volumes:
      # Mounted over the image user's home, so the volume inherits its ownership (a fresh path would be root-owned).
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Temporal's own web interface (port 8233) is NOT published: it has no login and can signal or end any workflow. The web
    # service serves it to signed-in administrators at /temporal, read-only (see TEMPORAL_UI_WRITABLE). For the command line:
    #   docker compose -f deploy/compose.yml exec temporal temporal workflow list

  # The product: sign-in, board, start, decisions, GitHub webhooks.
  web:
    <<: *shelf
    command: ["shelf-web"]
    ports:
      # Every interface unless WEB_BIND says otherwise (127.0.0.1 when your reverse proxy runs on this server).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs the workflows and the agents. Scale it: `docker compose up -d --scale worker=3`.
  worker:
    <<: *shelf
    command: ["shelf-worker"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      SHELF_CONFIG: /etc/shelf/shelf.toml
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      # Claude Code's sandbox inside a container needs its weaker nested mode.
      SHELF_NESTED_SANDBOX: "1"
      # Each repository's tools and package caches (mise, Maven, npm...) live here, one home per repository.
      SHELF_CACHE_DIR: /cache
    # A `volumes` key replaces the shared one, so the shared mounts are repeated here.
    volumes:
      - ./config:/etc/shelf:ro
      - ./secrets:/run/secrets:ro
      - worker-cache:/cache
    # The agents' sandbox (bubblewrap) needs user namespaces, which the default seccomp profile blocks. This is the only
    # service that relaxes it, and the agents it runs only ever see a clone of the repository and a one-hour token.
    security_opt:
      - seccomp=unconfined
      # Ubuntu 23.10+ hosts restrict unprivileged user namespaces with AppArmor, which the sandbox needs too.
      - apparmor=unconfined

volumes:
  temporal-data:
  worker-cache:
